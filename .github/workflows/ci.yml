name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Fast Optuna pass for CI; full runs use the default (20).
      SIGNALFORGE_N_TRIALS: "5"
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff pytest-cov

      - name: Lint with ruff
        run: ruff check src tests scripts

      - name: Generate synthetic sample data (no Kaggle creds in CI)
        run: python scripts/generate_sample_data.py

      - name: Build features and train models
        run: |
          python scripts/engineer_real_features.py
          python scripts/train_with_optuna.py

      - name: Run tests
        run: pytest tests/ -v
