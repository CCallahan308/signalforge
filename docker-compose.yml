# Single service: the Streamlit dashboard. The pipeline is file-based
# (Parquet + pickled models); there is no database or API service.
services:
  dashboard:
    build: .
    container_name: signalforge-dashboard
    command: streamlit run src/app/dashboard.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
